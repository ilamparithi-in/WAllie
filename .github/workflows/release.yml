name: Release WAllie

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Draft Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, win, mac]
        include:
          - target: linux
            os: ubuntu-latest
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache Flatpak Runtime
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: ${{ runner.os }}-flatpak-23.08

      - name: Set up Snapcraft & LXD
        if: runner.os == 'Linux'
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Install npm dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Release Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package Electron App
        run: node scripts/build-package.cjs --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: WAllie ${{ github.ref_name }}
          draft: true
          files: |
            dist-pack/*.AppImage
            dist-pack/*.deb
            dist-pack/*.rpm
            dist-pack/*.pkg.tar.zst
            dist-pack/*.flatpak
            dist-pack/*.snap
            dist-pack/*.exe
            dist-pack/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Built Snap Path
        if: runner.os == 'Linux'
        id: snap
        run: echo "path=$(ls dist-pack/*.snap)" >> $GITHUB_OUTPUT

      - name: Publish Snap to Stable Channel
        if: runner.os == 'Linux'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: candidate,stable

  build-snap-arm64:
    name: Build & Release ARM64 Snap
    runs-on: ubuntu-24.04-arm
    needs: build-and-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Snapcraft & LXD
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Release Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package ARM64 Snap
        run: node scripts/build-package.cjs --linux snap --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Snap Asset to Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-pack/*.snap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Built Snap Path
        id: snap
        run: echo "path=$(ls dist-pack/*.snap)" >> $GITHUB_OUTPUT

      - name: Publish ARM64 Snap to Stable Channel
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: candidate,stable
