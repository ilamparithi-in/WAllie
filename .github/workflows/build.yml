name: CI & Build Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAS_SNAP_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
  HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: Linux-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Linux-electron-cache-

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package Electron App
        run: node scripts/build-package.cjs --linux AppImage deb rpm pacman --x64 --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-linux
          path: |
            dist-pack/*.AppImage
            dist-pack/*.zsync
            dist-pack/*.deb
            dist-pack/*.rpm
            dist-pack/*.pkg.tar.zst
          compression-level: 0
          if-no-files-found: error

  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: Windows-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Windows-electron-cache-

      - name: Install npm dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package Electron App
        run: node scripts/build-package.cjs --win --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-win
          path: dist-pack/*.exe
          compression-level: 0
          if-no-files-found: error

  build-mac:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macOS-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            macOS-electron-cache-

      - name: Install npm dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package Electron App
        run: node scripts/build-package.cjs --mac --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-mac
          path: dist-pack/*.dmg
          compression-level: 0
          if-no-files-found: error

  build-snap-x64:
    name: Build (Snap x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: Linux-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Linux-electron-cache-

      - name: Set up Snapcraft & LXD
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package x64 Snap
        run: node scripts/build-package.cjs --linux snap --x64 --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-snap-x64
          path: dist-pack/*.snap
          compression-level: 0
          if-no-files-found: error

  build-snap-arm64:
    name: Build (Snap ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: Linux-arm64-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Linux-arm64-electron-cache-

      - name: Set up Snapcraft & LXD
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package ARM64 Snap
        run: node scripts/build-package.cjs --linux snap --arm64 --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-snap-arm64
          path: dist-pack/*.snap
          compression-level: 0
          if-no-files-found: error

  build-flatpak-x64:
    name: Build (Flatpak x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: Linux-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Linux-electron-cache-

      - name: Cache Flatpak Runtime
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: Linux-x64-flatpak-${{ hashFiles('electron-builder.yml') }}-26.08
          restore-keys: |
            Linux-x64-flatpak-

      - name: Install Flatpak packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package x64 Flatpak
        run: node scripts/build-package.cjs --linux flatpak --x64 --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-flatpak-x64
          path: dist-pack/*.flatpak
          compression-level: 0
          if-no-files-found: error

  build-flatpak-arm64:
    name: Build (Flatpak ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: Linux-arm64-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            Linux-arm64-electron-cache-

      - name: Cache Flatpak Runtime
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: Linux-arm64-flatpak-${{ hashFiles('electron-builder.yml') }}-26.08
          restore-keys: |
            Linux-arm64-flatpak-

      - name: Install Flatpak packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub --arch=aarch64 org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package ARM64 Flatpak
        run: node scripts/build-package.cjs --linux flatpak --arm64 --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallie-build-flatpak-arm64
          path: dist-pack/*.flatpak
          compression-level: 0
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly & Edge Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-win, build-mac, build-snap-x64, build-snap-arm64, build-flatpak-x64, build-flatpak-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-pack
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la dist-pack

      - name: Resolve Built Snaps
        id: snaps
        run: |
          X64_SNAP=$(find dist-pack -maxdepth 1 -name "*amd64*.snap" -print -quit)
          ARM_SNAP=$(find dist-pack -maxdepth 1 -name "*arm64*.snap" -print -quit)
          echo "x64=$X64_SNAP" >> $GITHUB_OUTPUT
          echo "arm64=$ARM_SNAP" >> $GITHUB_OUTPUT

      - name: Publish x64 Snap to Edge Channel
        if: env.HAS_SNAP_CREDENTIALS == 'true' && steps.snaps.outputs.x64 != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snaps.outputs.x64 }}
          release: edge

      - name: Publish ARM64 Snap to Edge Channel
        if: env.HAS_SNAP_CREDENTIALS == 'true' && steps.snaps.outputs.arm64 != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snaps.outputs.arm64 }}
          release: edge

      - name: Prepare Standardized Nightly Artifacts
        run: node scripts/prepare-nightly.cjs

      - name: Update Git Tag Pointer for Rolling Nightly
        run: |
          git tag -f nightly ${{ github.sha }}
          git push origin nightly --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish All Platform Nightly Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: WAllie Nightly
          prerelease: true
          make_latest: false
          files: dist-pack/nightly/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Homebrew Tap Nightly Dispatch
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ilamparithi-in/homebrew-tap
          event-type: update_cask
          client-payload: '{"cask": "wallie@nightly"}'
