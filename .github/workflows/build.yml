name: CI & Build Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, win, mac]
        include:
          - target: linux
            os: ubuntu-latest
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Electron & Builder Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache Flatpak Runtime
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: ${{ runner.os }}-flatpak-23.08

      - name: Set up Snapcraft & LXD
        if: runner.os == 'Linux'
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Install npm dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package Electron App
        run: node scripts/build-package.cjs --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wallie-build-${{ matrix.target }}
          path: |
            dist-pack/*.AppImage
            dist-pack/*.deb
            dist-pack/*.rpm
            dist-pack/*.pkg.tar.zst
            dist-pack/*.flatpak
            dist-pack/*.snap
            dist-pack/*.exe
            dist-pack/*.dmg
          compression-level: 0
          if-no-files-found: warn

      - name: Publish Snap to Edge Channel
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist-pack/*.snap
          release: edge

  build-snap-arm64:
    name: Build & Test ARM64 Snap
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Snapcraft & LXD
        uses: canonical/craft-actions/snapcraft/setup@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer and main bundles
        run: npm run build

      - name: Print Version Diagnostics
        run: node scripts/version-helper.cjs --json

      - name: Package ARM64 Snap
        run: node scripts/build-package.cjs --linux snap --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wallie-build-snap-arm64
          path: dist-pack/*.snap
          compression-level: 0
          if-no-files-found: warn

      - name: Publish ARM64 Snap to Edge Channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist-pack/*.snap
          release: edge
