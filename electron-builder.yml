appId: dev.ilamparithi.wallie
productName: WAllie
directories:
  output: dist-pack
  buildResources: build
files:
  - dist/**/*
  - package.json
linux:
  category: Chat;Network;InstantMessaging;
  target:
    - pacman
    - deb
    - rpm
    - AppImage
    - flatpak
  desktop:
    Name: WAllie
    Comment: Electron-based WhatsApp Client for Linux with Multi-account and Extensions Support
    Categories: Network;InstantMessaging;Chat;
    MimeType: x-scheme-handler/whatsapp;x-scheme-handler/wallie;
protocols:
  - name: whatsapp
    schemes:
      - whatsapp
  - name: wallie
    schemes:
      - wallie
