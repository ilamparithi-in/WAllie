appId: dev.ilamparithi.wallie
productName: WAllie
directories:
  output: dist-pack
  buildResources: build
files:
  - dist/**/*
  - package.json
linux:
  category: Chat;Network;InstantMessaging;
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: pacman
      arch: [x64, arm64]
    - target: flatpak
      arch: [x64, arm64]
flatpak:
  runtimeVersion: "23.08"
  finishArgs:
    - "--share=ipc"
    - "--socket=x11"
    - "--socket=wayland"
    - "--socket=pulseaudio"
    - "--share=network"
    - "--talk-name=org.freedesktop.Notifications"
    - "--filesystem=xdg-download"
    - "--filesystem=xdg-pictures"
    - "--filesystem=xdg-videos"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [x64, arm64, universal]
protocols:
  - name: whatsapp
    schemes:
      - whatsapp
  - name: wallie
    schemes:
      - wallie
