<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Controls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      background-color: #1f2c34;
      color: #e9edef;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 42px;
    }
    /* Browser Addressbar Toolbar */
    .browser-toolbar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      background: #1f2c34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Icon Buttons */
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #aebac1;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      outline: none;
      flex-shrink: 0;
    }
    .icon-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: #e9edef;
    }
    .icon-btn:active:not(:disabled) {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.14);
    }
    .icon-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    /* Loading animation for reload button */
    .spinning {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    /* Address bar container */
    .address-bar {
      flex: 1;
      height: 30px;
      background: #111b21;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 4px 0 6px;
      gap: 6px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-width: 140px;
    }
    .address-bar:focus-within {
      border-color: #00a884;
      box-shadow: 0 0 0 1.5px rgba(0, 168, 132, 0.3);
    }
    /* Security/Certificate Lock Button */
    .cert-lock-btn {
      background: transparent;
      border: none;
      color: #00a884;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      outline: none;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .cert-lock-btn:hover {
      background: rgba(0, 168, 132, 0.18);
    }
    .cert-lock-btn:active {
      transform: scale(0.92);
      background: rgba(0, 168, 132, 0.28);
    }
    .cert-lock-btn.insecure {
      color: #f87171;
    }
    .cert-lock-btn.insecure:hover {
      background: rgba(248, 113, 113, 0.18);
    }
    /* URL Input */
    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e9edef;
      font-size: 13px;
      font-family: inherit;
      user-select: text;
      min-width: 40px;
    }
    .url-input::selection {
      background: rgba(0, 168, 132, 0.45);
    }
    /* Zero Data Saved Privacy Pill */
    .privacy-pill {
      background: rgba(0, 168, 132, 0.14);
      color: #00a884;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: default;
      transition: background 0.15s ease;
    }
    .privacy-pill:hover {
      background: rgba(0, 168, 132, 0.22);
    }
    /* Copy Container & Dynamic Toast Pill */
    .copy-container {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      position: relative;
    }
    .copied-pill {
      display: none;
      background: #00a884;
      color: #111b21;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      animation: popIn 0.15s ease forwards;
    }
    .copied-pill.show {
      display: inline-block;
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    /* Copy URL button inside address bar */
    .copy-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #8696a0;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      outline: none;
      flex-shrink: 0;
    }
    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e9edef;
    }
    .copy-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.18);
    }
    .copy-success {
      color: #00a884 !important;
    }
  </style>
</head>
<body>
  <!-- Browser Addressbar Toolbar -->
  <div class="browser-toolbar">
    <!-- Back Button (Lucide: ArrowLeft) -->
    <button id="btn-back" class="icon-btn" title="Back (Alt+Left)" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>
    </button>

    <!-- Forward Button (Lucide: ArrowRight) -->
    <button id="btn-forward" class="icon-btn" title="Forward (Alt+Right)" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    </button>

    <!-- Reload Button (Lucide: RotateCw) -->
    <button id="btn-reload" class="icon-btn" title="Refresh (Ctrl+R / F5)">
      <svg id="reload-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
    </button>

    <!-- Address Bar -->
    <div class="address-bar">
      <!-- Certificate Lock Button (Lucide: Lock) -->
      <button id="btn-cert" class="cert-lock-btn" title="View SSL/TLS Certificate">
        <svg id="lock-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>

      <!-- URL Input Field -->
      <input id="url-input" class="url-input" type="text" placeholder="Search or type URL" spellcheck="false" autocomplete="off" />

      <!-- Zero Data Saved Privacy Badge (Lucide: ShieldCheck) -->
      <span class="privacy-pill" title="Ephemeral Sandbox: Zero browsing history, cookies, or cache saved to disk. All data is wiped on window close.">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        Sandbox
      </span>

      <!-- Copy Current URL Button & Dynamic "Copied!" Pill -->
      <div class="copy-container">
        <span id="copied-pill" class="copied-pill">Copied!</span>
        <button id="btn-copy" class="copy-btn" title="Copy current URL">
          <svg id="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 3-Dot More Options Menu Button (Lucide: EllipsisVertical) -->
    <button id="btn-menu" class="icon-btn" title="More options">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"/>
        <circle cx="12" cy="5" r="1"/>
        <circle cx="12" cy="19" r="1"/>
      </svg>
    </button>
  </div>

  <script src="sandbox.js"></script>
</body>
</html>
